# deployment.yaml — how this policy was trained, as data the robot side reproduces.
# Schema: robot-integration/docs/deployment-contract.md (schema_version 1).
# Every value below is copied from nao_walking_env.py in this folder; if the
# env changes, this file must change with it.
schema_version: 1
name: sac_baseline_test26
algorithm: sac
description: >
  SAC promoted from experiments/test_26_sac, run sac_pilot_v5 (1.23M steps).
  Residual corrections on the LOOPED Webots Forwards gait (2.64 s period).
  Correct (w,x,y,z) quaternion handling; linear velocity in the yaw-only
  heading frame. Residual actions were IGNORED during the 60-step warm-up
  stand in training (env warmup_actions=False), so control.warmup_actions
  is false here and the robot runtime does the same. Stays upright in headless
  simulation (48 s, ~0.06 m/s) but shuffles and turns, and is fragile:
  it fell after 5.5 s in the GUI. Treat a robot run as exploratory.

policy:
  format: sb3
  sb3_class: SAC
  # Gitignored. Copy the run here (see README.md) or pass --model to the export tool.
  model: runs/sac_pilot_v5/final_model.zip

control:
  control_hz: 30            # control_dt = 1/30 s (physics 120 Hz, decimation 4)
  warmup_steps: 60          # reference = home pose, phase signal = (0, 1)
  warmup_actions: false     # env warmup_actions=False: residual ignored during warm-up
  max_episode_steps: 1500   # 50 s

joints:
  leg_order: [LHipYawPitch, LHipRoll, LHipPitch, LKneePitch, LAnklePitch, LAnkleRoll,
              RHipYawPitch, RHipRoll, RHipPitch, RKneePitch, RAnklePitch, RAnkleRoll]
  # NaoWalkingEnv.LEG_JOINT_LIMITS_DEG (knee lower limit raised to +2 deg, FIX 6)
  limits_deg:
    LHipYawPitch: [-65.6, 42.4]
    LHipRoll:     [-21.7, 45.3]
    LHipPitch:    [-88.0, 27.7]
    LKneePitch:   [2.0, 121.0]
    LAnklePitch:  [-68.1, 52.9]
    LAnkleRoll:   [-22.8, 44.1]
    RHipYawPitch: [-65.6, 42.4]
    RHipRoll:     [-45.3, 21.7]
    RHipPitch:    [-88.0, 27.7]
    RKneePitch:   [2.0, 121.0]
    RAnklePitch:  [-68.0, 53.4]
    RAnkleRoll:   [-44.1, 22.8]
  # WEBOTS_T0_POSE_DEG = first frame of Forwards.motion
  home_pose_deg:
    LHipYawPitch: 0.0
    LHipRoll:     1.547
    LHipPitch:    -28.935
    LKneePitch:   59.702
    LAnklePitch:  -30.768
    LAnkleRoll:   -1.547
    RHipYawPitch: 0.0
    RHipRoll:     1.547
    RHipPitch:    -28.935
    RKneePitch:   59.702
    RAnklePitch:  -30.768
    RAnkleRoll:   -1.547
  # NaoWalkingEnv.FIXED_JOINT_POSES_DEG (held by PD for the whole episode)
  fixed_pose_deg:
    HeadYaw: 0
    HeadPitch: 0
    LShoulderPitch: 84
    LShoulderRoll: 10
    LElbowYaw: -70
    LElbowRoll: -25
    LWristYaw: 0
    LHand: 0
    RShoulderPitch: 84
    RShoulderRoll: -10
    RElbowYaw: 70
    RElbowRoll: 25
    RWristYaw: 0
    RHand: 0

reference_gait:
  keyframes:   ../../shared/reference_gaits/forwards_looped_keyframes.npy
  timestamps:  ../../shared/reference_gaits/forwards_looped_timestamps.npy
  joint_names: ../../shared/reference_gaits/forwards_looped_joint_names.txt
  after_end: wrap           # WebotsReferenceGait(loop=True) wraps gait time at 52.80 s
  phase_period_s: 2.64      # get_phase(t) = (t mod 2.64) / 2.64 — a policy input

action:
  type: residual_on_gait    # q* = clip(q_ref(t) + scale_rad * clip(a, -1, 1), limits)
  scale_rad: 0.25

observation:
  quaternion_convention: wxyz
  spawn_yaw_deg: 180        # SPAWN_QUAT_WXYZ = (0,0,0,1): 180 deg yaw, robot faces world -x
  nonfinite_to_zero: true
  components:
    - {name: projected_gravity,   dim: 3}
    - {name: angular_velocity,    dim: 3, scale: 0.25}
    - {name: linear_velocity,     dim: 2, frame: heading}
    - {name: leg_joint_positions, dim: 12, normalization: limits_to_unit}
    - {name: base_height,         dim: 1}
    - {name: gait_phase,          dim: 2, warmup_value: [0.0, 1.0]}
